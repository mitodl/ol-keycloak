# Reference prek + autofix.ci workflow for repositories with neither uv nor Node.
#
# Copy to .github/workflows/autofix.yml and change only the lines marked ADAPT.
# Contract: https://github.com/mitodl/ol-github-workflows/blob/main/docs/prek-autofix-contract.md
# Playbook: https://github.com/mitodl/ol-github-workflows/blob/main/docs/prek-autofix-playbook.md
# Source:   https://github.com/mitodl/ol-github-workflows/blob/main/workflow-templates/autofix-standalone.yml
#
# prek-version below is the repository's single prek pin; local installs use the same version
# (`uv tool install prek==X.Y.Z`). Renovate's github-actions manager updates it.
# prek-action v3.0.0 checks the download's SHA-256 only for prek 0.4.11 and older, so prefer the
# uv or Node template where the repository has either.
name: autofix.ci # autofix.ci refuses to run under any other name
on:
  pull_request:
  push:
    branches: [main] # ADAPT: the repository's default branch
permissions:
  contents: read
concurrency:
  group: autofix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  prek:
    name: prek # the required-check context; keep it stable
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # ADAPT: private repositories delete this block (contract §3.1)
      - uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204 # v3.0.1
        with:
          install-only: true # also restores and saves the prek hook cache
          prek-version: "v0.5.5"
      # ADAPT: toolchains for local hooks go here, installed from lockfiles or exact pins.
      # See the playbook's "Toolchains" section (Node, packer, the project environment).
      - name: Tree is clean before hooks run
        id: clean-tree
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Setup left changes in the working tree, and autofix.ci would commit them."
            git status --porcelain
            exit 1
          fi
      - name: prek (fixing pass)
        id: fixing-pass
        run: prek run --all-files --color=always || true
      - name: prek (must converge)
        id: converge
        run: prek run --all-files --show-diff-on-failure --color=always
      - name: Default branch has no fixable drift
        id: no-drift
        if: github.event_name != 'pull_request'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Hooks changed files on ${GITHUB_REF_NAME}. Commit these fixes in a pull request."
            git status --porcelain
            git diff
            exit 1
          fi
      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
        id: autofix
        if: github.event_name == 'pull_request'
        with:
          fail-fast: false
