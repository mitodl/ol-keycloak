name: Build ol-spi and release

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up JDK 17
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build with Maven
      run: mvn --batch-mode --update-snapshots verify
      working-directory: ./ol-keycloak/ol-spi

    - name: Create Release with jar file
      uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
      with:
        token: "${{ secrets.GITHUB_TOKEN }}"
        tag_name: "latest"
        prerelease: false
        name: "ol-spi release"
        files: |
          ./ol-keycloak/ol-spi/target/*.jar
